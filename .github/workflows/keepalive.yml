name: Keep API warm

# Render's free tier puts the web service to sleep after ~15 minutes of
# inactivity, so the first request afterwards pays a multi-second cold start.
# That showed up as a slow /api/status on the landing page and occasional
# cold-start CORS errors on /api/site-content. This cron pings the API often
# enough to keep it awake.
#
# Note: GitHub's scheduled runs are best-effort and can be delayed by several
# minutes under load. For rock-solid uptime, an external monitor
# (UptimeRobot, cron-job.org, etc.) hitting the same endpoint is more reliable;
# this workflow is the zero-cost, in-repo option.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {}

# Don't let a slow/queued run pile up behind the next scheduled tick.
concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API endpoints
        env:
          # Override via repository variable if the API host ever changes.
          API_BASE: ${{ vars.KEEPALIVE_API_BASE || 'https://s-pay.onrender.com' }}
        run: |
          set -u
          # --retry-all-errors + a long max-time give the service room to wake
          # from a cold start without the workflow failing on the first slow hit.
          for path in /api/status /api/site-content; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 90 --retry 4 --retry-delay 10 --retry-all-errors \
              "$API_BASE$path" || echo "000")
            echo "GET $API_BASE$path -> $code"
          done
