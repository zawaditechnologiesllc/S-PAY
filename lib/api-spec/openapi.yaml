openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: S-PAY API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: wallet
    description: Wallet balance and transactions
  - name: banking
    description: Virtual bank accounts and incoming payments
  - name: card
    description: Virtual card management and transactions
  - name: jobs
    description: Remote job listings
  - name: dashboard
    description: Dashboard summary and overview
  - name: webhooks
    description: External service webhooks
  - name: payroll
    description: Payouts-as-a-service — companies pay their workers through S-PAY

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /status:
    get:
      operationId: getPlatformStatus
      tags: [health]
      summary: Public platform status (maintenance mode flag + message)
      responses:
        "200":
          description: Platform status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login step 1 — verify password, email a 6-digit code
      description: >
        With a correct password, S-PAY emails a 6-digit verification code and
        returns requiresVerification=true. No session token is issued here —
        call /auth/verify-login-code with the code to complete sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Password accepted — verification code emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-login-code:
    post:
      operationId: verifyLoginCode
      tags: [auth]
      summary: Login step 2 — verify the emailed 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLoginCodeRequest"
      responses:
        "200":
          description: Code verified — session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Code incorrect or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the current user's profile (name, phone, country, business name, avatar)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the current account and its data (required for App Store / Play Store compliance)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/oauth/google:
    post:
      operationId: googleTokenSignIn
      tags: [auth]
      summary: Sign in / sign up with a Google ID token (native mobile flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleTokenRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/oauth/apple:
    post:
      operationId: appleTokenSignIn
      tags: [auth]
      summary: Sign in / sign up with Apple (native iOS flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleTokenRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Re-send the email confirmation link to the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sent (or already verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/pin:
    post:
      operationId: setTransactionPin
      tags: [auth]
      summary: Set or change the transaction PIN (changing requires the current PIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  type: string
                  description: New 4–6 digit PIN
                currentPin:
                  type: string
                  description: Required only when changing an existing PIN
              required: [pin]
      responses:
        "200":
          description: PIN saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Current PIN incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link (response never reveals whether the account exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using an emailed reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
              required: [token, password]
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kyc/start:
    post:
      operationId: startKyc
      tags: [auth]
      summary: Begin identity verification (Noah) — returns the hosted verification URL once the provider is live
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Verification provider not configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /wallet/balance:
    get:
      operationId: getWalletBalance
      tags: [wallet]
      summary: Get wallet balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"

  /wallet/transactions:
    get:
      operationId: getWalletTransactions
      tags: [wallet]
      summary: Get wallet transaction history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"

  /wallet/send:
    post:
      operationId: sendMoney
      tags: [wallet]
      summary: Send money to another user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMoneyRequest"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Insufficient balance or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/add-funds:
    post:
      operationId: addFunds
      tags: [wallet]
      summary: Add funds to wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFundsRequest"
      responses:
        "200":
          description: Deposit initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddFundsResponse"

  /banking/accounts:
    get:
      operationId: getBankingAccounts
      tags: [banking]
      summary: Get user virtual bank accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Banking accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankingAccountsResponse"
    post:
      operationId: openVirtualAccount
      tags: [banking]
      summary: Open (or fetch) a USD/EUR virtual account
      description: KYC-gated and sticky — one active account per currency. 503 until an issuer is configured.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
      responses:
        "200":
          description: Existing account returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAccountResponse"
        "201":
          description: Account opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAccountResponse"

  /banking/incoming-payments:
    get:
      operationId: getIncomingPayments
      tags: [banking]
      summary: Get recent incoming payments
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Incoming payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingPaymentsResponse"

  /banking/withdraw:
    post:
      operationId: initiateWithdraw
      tags: [banking]
      summary: Initiate a withdrawal via Noah payout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          description: Withdrawal initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banking/rates:
    get:
      operationId: getExchangeRates
      tags: [banking]
      summary: Get current exchange rates for withdrawal
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            example: USDC
        - name: target
          in: query
          required: true
          schema:
            type: string
            example: KES
      responses:
        "200":
          description: Exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"

  /card/details:
    get:
      operationId: getCardDetails
      tags: [card]
      summary: Get user virtual card details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailsResponse"

  /card/transactions:
    get:
      operationId: getCardTransactions
      tags: [card]
      summary: Get card transaction history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Card transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardTransactionListResponse"

  /card/spending-summary:
    get:
      operationId: getSpendingSummary
      tags: [card]
      summary: Get spending summary by category
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [this_month, last_month, last_3_months]
            default: this_month
      responses:
        "200":
          description: Spending summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingSummaryResponse"

  /card/waitlist:
    post:
      operationId: joinCardWaitlist
      tags: [card]
      summary: Join the virtual card waitlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Added to waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /card/issue:
    post:
      operationId: issueCard
      tags: [card]
      summary: Issue the user's virtual card (requires the card program to be enabled by an admin and KYC approval)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card issued (or already issued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailsResponse"
        "403":
          description: Card program disabled or KYC not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe Issuing not configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: Get remote job listings
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Job listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsResponse"

  /jobs/{jobId}:
    get:
      operationId: getJobById
      tags: [jobs]
      summary: Get a specific job listing
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/noah:
    post:
      operationId: noahWebhook
      tags: [webhooks]
      summary: Noah API webhook handler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [webhooks]
      summary: Stripe webhook handler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      summary: Admin platform statistics
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      summary: List all users
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: kycStatus
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/transactions:
    get:
      operationId: getAdminTransactions
      summary: List all transactions
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionsResponse"

  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: System configuration status
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/fees:
    get:
      operationId: getFeeSchedule
      summary: Read the platform fee schedule (provider cost + S-PAY margin = user price)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
    put:
      operationId: updateFeeSchedule
      summary: Update the platform fee schedule (applies to new quotes immediately, no deploy)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeSchedule"
      responses:
        "200":
          description: Updated fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"

  /admin/custom-jobs:
    get:
      operationId: getCustomJobs
      summary: List S-PAY's own injected job listings
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Custom listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomJobsResponse"
    post:
      operationId: createCustomJob
      summary: Inject an S-PAY job listing (pinned to the top of the feed)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomJobCreateRequest"
      responses:
        "200":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomJob"

  /admin/custom-jobs/{jobId}:
    delete:
      operationId: deleteCustomJob
      summary: Remove an injected listing
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /site-content:
    get:
      operationId: getSiteContent
      tags: [health]
      summary: Public marketing content (hero, footer, colours) — editable in the admin panel
      responses:
        "200":
          description: Site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"

  /notifications:
    get:
      operationId: getNotifications
      tags: [auth]
      summary: The signed-in user's notifications (personal + broadcasts) with unread count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"

  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [auth]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /enquiries:
    post:
      operationId: createEnquiry
      tags: [health]
      summary: Submit an enquiry (landing page, contact page, or in-app — one funnel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                subject:
                  type: string
                  maxLength: 160
                message:
                  type: string
                  maxLength: 5000
                source:
                  type: string
                  maxLength: 40
              required: [email, message]
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /banking/deposit:
    post:
      operationId: initiateDeposit
      tags: [banking]
      summary: Start a mobile-money top-up (executes via the payments partner)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                method:
                  type: string
                phoneNumber:
                  type: string
              required: [amount, method]
      responses:
        "200":
          description: Deposit instructions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Partner not configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/notifications:
    post:
      operationId: sendAdminNotification
      tags: [Admin]
      summary: Send a manual notification — to every user, or one user by email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 140
                body:
                  type: string
                  maxLength: 500
                email:
                  type: string
                  description: Leave empty to broadcast to all users
              required: [title, body]
      responses:
        "200":
          description: Sent
          content:
