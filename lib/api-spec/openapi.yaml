          type: string
          enum: [personal, business]
          default: personal
          description: "personal → Noah KYC · business → Noah KYB (business + representative verification)"
        businessName:
          type: string
          maxLength: 120
          description: Required when accountType is business — goes on the business virtual accounts
        signupSource:
          type: string
          maxLength: 64
          description: "Where the signup came from, e.g. jobs, jobs:<jobId>, landing, mobile"
      required:
        - email
        - password
        - fullName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    GoogleTokenRequest:
      type: object
      properties:
        idToken:
          type: string
          description: Google ID token obtained on-device (Android / iOS)
        signupSource:
          type: string
          maxLength: 64
      required:
        - idToken

    AppleTokenRequest:
      type: object
      properties:
        identityToken:
          type: string
          description: Apple identity token from Sign in with Apple
        fullName:
          type: string
          description: Provided by Apple only on first authorization
        signupSource:
          type: string
          maxLength: 64
      required:
        - identityToken

