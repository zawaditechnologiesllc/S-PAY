      type: object
      description: Partial update — switch the active provider and/or toggle providers on/off
      properties:
        activeProvider:
          type: string
          enum: [privy, cdp, turnkey, openfort, thirdweb, dynamic]
        enabled:
          type: object
          description: "Per-provider on/off, e.g. {\"privy\": false, \"cdp\": true}"
          properties:
            privy:
              type: boolean
            cdp:
              type: boolean
            turnkey:
              type: boolean
            openfort:
              type: boolean
            thirdweb:
              type: boolean
            dynamic:
              type: boolean

    PayoutProviderInfo:
      type: object
      properties:
        key:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
        label:
          type: string
          description: Human-readable provider name
        configured:
          type: boolean
          description: Whether the provider's API credentials are set in the environment
        enabled:
          type: boolean
          description: Admin on/off switch — OFF removes this rail from payout routing
        envHint:
          type: string
          description: The environment variables that activate this provider
        pricingNote:
          type: string
          description: One-line note on commercial terms (onboarding-fee posture especially)
        supportsDeposits:
          type: boolean
          description: Whether this provider can on-ramp (deposit) at least one corridor
        supportsVirtualAccounts:
          type: boolean
          description: Whether this provider can issue USD/EUR virtual accounts
        supportsKyc:
          type: boolean
          description: Whether this provider runs its own hosted KYC/KYB
      required:
        - key
        - label
        - configured
        - enabled
        - envHint
        - pricingNote

    PayoutProvidersResponse:
      type: object
      properties:
        preferredProvider:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
          description: Tiebreaker only; routing always picks the best rate for the customer
        virtualAccountIssuer:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
          description: Designated issuer for NEW virtual accounts (sticky per user once issued)
        kycProvider:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
          description: Provider that runs identity verification (KYC/KYB)
        providers:
          type: array
          items:
            $ref: "#/components/schemas/PayoutProviderInfo"
      required:
        - preferredProvider
        - providers

