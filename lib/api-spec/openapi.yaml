      type: object
      description: Returned by /auth/login when the password is correct — a 6-digit code has been emailed.
      properties:
        requiresVerification:
          type: boolean
          description: Always true; the client must collect the emailed code and call /auth/verify-login-code.
        email:
          type: string
          format: email
          description: The address the verification code was sent to.
      required:
        - requiresVerification
        - email

    VerifyLoginCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
          minLength: 6
          maxLength: 6
          description: The 6-digit code from the sign-in email.
      required:
        - email
        - code

    UpdateProfileRequest:
      type: object
      description: All fields optional; only the ones provided are changed. Email is immutable here.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phoneNumber:
          type: string
          maxLength: 32
          nullable: true
        country:
          type: string
          maxLength: 56
          nullable: true
        businessName:
          type: string
          maxLength: 120
          nullable: true
          description: Only applies to business accounts
        avatarUrl:
          type: string
          maxLength: 512
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
        spayId:
          type: string
          description: Public S-PAY identifier (spay_…) for receiving payments and payroll worker resolution
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        country:
          type: string
          nullable: true
          description: Self-reported country (drives payout-method defaults); editable from the profile screen
        kycStatus:
          type: string
          enum: [pending, approved, rejected]
        emailVerified:
          type: boolean
          description: Soft email confirmation — login is never blocked; the app shows a banner until confirmed
        adminRole:
          type: string
          enum: [superadmin, manager, support]
          nullable: true
          description: Present only for admin-tier accounts
        hasPin:
          type: boolean
          description: Whether the user has set a transaction PIN (required to send/withdraw)
        isAdmin:
          type: boolean
        avatarUrl:
          type: string
        celoWalletAddress:
          type: string
          nullable: true
          description: "EVM wallet address on the Celo network — provisioned lazily by the active wallet provider on the user's first money action (never at signup/login, so jobs-only users cost zero WaaS MAUs)"
        accountType:
          type: string
          enum: [personal, business]
        businessName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - kycStatus
        - isAdmin
        - createdAt

