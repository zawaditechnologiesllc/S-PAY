      type: object
      properties:
        activeProvider:
          type: string
          enum: [privy, cdp, turnkey, openfort, thirdweb, dynamic]
          description: Provider used to create NEW wallets (existing wallets always keep the provider that holds their key)
        providers:
          type: array
          items:
            $ref: "#/components/schemas/WalletProviderInfo"
      required:
        - activeProvider
        - providers

