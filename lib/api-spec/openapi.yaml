components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Payroll ──────────────────────────────────────────────────────────────
    Employer:
      type: object
      properties:
        id: { type: string }
        companyName: { type: string }
        email: { type: string }
        websiteUrl: { type: string, nullable: true }
        country: { type: string, nullable: true }
        status: { type: string, enum: [pending, verified, rejected, suspended] }
        balanceUsdc: { type: number }
        fundingAddress: { type: string, nullable: true }
        webhookUrl: { type: string, nullable: true }
        autoCreateWorkers: { type: boolean }
        createdAt: { type: string }
      required: [id, companyName, email, status, balanceUsdc, autoCreateWorkers, createdAt]

    EmployerRegisterRequest:
      type: object
      required: [companyName]
      properties:
        companyName: { type: string }
        email: { type: string }
        websiteUrl: { type: string }
        country: { type: string }
        webhookUrl: { type: string }
        autoCreateWorkers: { type: boolean }

    EmployerRegisterResponse:
      type: object
      properties:
        employer: { $ref: "#/components/schemas/Employer" }
        webhookSecret: { type: string }
        message: { type: string }
      required: [employer]

    EmployerResponse:
      type: object
      properties:
        employer: { $ref: "#/components/schemas/Employer" }
      required: [employer]

    EmployerUpdateRequest:
      type: object
      properties:
        companyName: { type: string }
        email: { type: string }
        websiteUrl: { type: string }
        country: { type: string }
        webhookUrl: { type: string }
        autoCreateWorkers: { type: boolean }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        prefix: { type: string }
        sandbox: { type: boolean }
        scopes: { type: array, items: { type: string } }
        lastUsedAt: { type: string, nullable: true }
        revokedAt: { type: string, nullable: true }
        expiresAt: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, prefix, sandbox, scopes, createdAt]

    ApiKeyListResponse:
      type: object
      properties:
        apiKeys: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
      required: [apiKeys]

    ApiKeyCreateRequest:
      type: object
      properties:
        name: { type: string }
        sandbox: { type: boolean }
        scopes: { type: array, items: { type: string } }
        expiresInDays: { type: integer }

    ApiKeyCreateResponse:
      type: object
      properties:
        apiKey: { type: string }
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        sandbox: { type: boolean }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, nullable: true }
        message: { type: string }
      required: [apiKey, id]

    BatchPaymentInput:
      type: object
      required: [workerIdentifier, amount]
      properties:
        workerIdentifier: { type: string }
        identifierType: { type: string, enum: [email, phone, spay_id, celo_address] }
        amount: { type: number }
        currency: { type: string }
        reason: { type: string }
        externalId: { type: string }

    BatchCreateRequest:
      type: object
      required: [payments]
      properties:
        reference: { type: string }
        description: { type: string }
        currency: { type: string }
        idempotencyKey: { type: string }
        webhookUrl: { type: string }
        payments:
          type: array
          items: { $ref: "#/components/schemas/BatchPaymentInput" }

    Batch:
      type: object
      properties:
        id: { type: string }
        reference: { type: string, nullable: true }
        description: { type: string, nullable: true }
        sandbox: { type: boolean }
        currency: { type: string }
        status: { type: string, enum: [draft, processing, completed, partially_completed, failed, cancelled] }
        totalAmount: { type: number }
        feeAmount: { type: number }
        totalCost: { type: number }
        paymentCount: { type: integer }
        completedCount: { type: integer }
        failedCount: { type: integer }
