          enum: [privy, cdp, turnkey, openfort, thirdweb, dynamic]
        label:
          type: string
          description: Human-readable provider name
        configured:
          type: boolean
          description: Whether the provider's API credentials are set in the environment
        enabled:
          type: boolean
          description: Admin on/off switch — OFF blocks new wallets AND sends signed via this provider
        wallets:
          type: integer
          description: How many user wallets this provider currently holds keys for
        envHint:
          type: string
          description: The environment variables that activate this provider
      required:
        - key
        - label
        - configured
        - enabled
        - wallets
        - envHint

