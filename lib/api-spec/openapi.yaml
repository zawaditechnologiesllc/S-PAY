      properties:
        preferredProvider:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
        virtualAccountIssuer:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
        kycProvider:
          type: string
          enum: [noah, bridge, conduit, yellowcard, thunes]
        enabled:
          type: object
          description: "Per-provider on/off, e.g. {\"noah\": false, \"yellowcard\": true}"
          properties:
            noah:
              type: boolean
            bridge:
              type: boolean
            conduit:
              type: boolean
            yellowcard:
              type: boolean
            thunes:
              type: boolean

