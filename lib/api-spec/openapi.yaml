openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: S-PAY API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: wallet
    description: Wallet balance and transactions
  - name: banking
    description: Virtual bank accounts and incoming payments
  - name: card
    description: Virtual card management and transactions
  - name: jobs
    description: Remote job listings
  - name: dashboard
    description: Dashboard summary and overview
  - name: webhooks
    description: External service webhooks

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /status:
    get:
      operationId: getPlatformStatus
      tags: [health]
      summary: Public platform status (maintenance mode flag + message)
      responses:
        "200":
          description: Platform status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the current account and its data (required for App Store / Play Store compliance)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/oauth/google:
    post:
      operationId: googleTokenSignIn
      tags: [auth]
      summary: Sign in / sign up with a Google ID token (native mobile flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleTokenRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/oauth/apple:
    post:
      operationId: appleTokenSignIn
      tags: [auth]
      summary: Sign in / sign up with Apple (native iOS flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleTokenRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /wallet/balance:
    get:
      operationId: getWalletBalance
      tags: [wallet]
      summary: Get wallet balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"

  /wallet/transactions:
    get:
      operationId: getWalletTransactions
      tags: [wallet]
      summary: Get wallet transaction history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"

  /wallet/send:
    post:
      operationId: sendMoney
      tags: [wallet]
      summary: Send money to another user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMoneyRequest"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Insufficient balance or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/add-funds:
    post:
      operationId: addFunds
      tags: [wallet]
      summary: Add funds to wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFundsRequest"
      responses:
        "200":
          description: Deposit initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddFundsResponse"

  /banking/accounts:
    get:
      operationId: getBankingAccounts
      tags: [banking]
      summary: Get user virtual bank accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Banking accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankingAccountsResponse"

  /banking/incoming-payments:
    get:
      operationId: getIncomingPayments
      tags: [banking]
      summary: Get recent incoming payments
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Incoming payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingPaymentsResponse"

  /banking/withdraw:
    post:
      operationId: initiateWithdraw
      tags: [banking]
      summary: Initiate a withdrawal via Noah payout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          description: Withdrawal initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banking/rates:
    get:
      operationId: getExchangeRates
      tags: [banking]
      summary: Get current exchange rates for withdrawal
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            example: USDC
        - name: target
          in: query
          required: true
          schema:
            type: string
            example: KES
      responses:
        "200":
          description: Exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"

  /card/details:
    get:
      operationId: getCardDetails
      tags: [card]
      summary: Get user virtual card details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailsResponse"

  /card/transactions:
    get:
      operationId: getCardTransactions
      tags: [card]
      summary: Get card transaction history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Card transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardTransactionListResponse"

  /card/spending-summary:
    get:
      operationId: getSpendingSummary
      tags: [card]
      summary: Get spending summary by category
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [this_month, last_month, last_3_months]
            default: this_month
      responses:
        "200":
          description: Spending summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingSummaryResponse"

  /card/waitlist:
    post:
      operationId: joinCardWaitlist
      tags: [card]
      summary: Join the virtual card waitlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Added to waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /card/issue:
    post:
      operationId: issueCard
      tags: [card]
      summary: Issue the user's virtual card (requires the card program to be enabled by an admin and KYC approval)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card issued (or already issued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailsResponse"
        "403":
          description: Card program disabled or KYC not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe Issuing not configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: Get remote job listings
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Job listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsResponse"

  /jobs/{jobId}:
    get:
      operationId: getJobById
      tags: [jobs]
      summary: Get a specific job listing
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/noah:
    post:
      operationId: noahWebhook
      tags: [webhooks]
      summary: Noah API webhook handler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [webhooks]
      summary: Stripe webhook handler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      summary: Admin platform statistics
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      summary: List all users
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: kycStatus
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/transactions:
    get:
      operationId: getAdminTransactions
      summary: List all transactions
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionsResponse"

  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: System configuration status
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/fees:
    get:
      operationId: getFeeSchedule
      summary: Read the platform fee schedule (provider cost + S-PAY margin = user price)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
    put:
      operationId: updateFeeSchedule
      summary: Update the platform fee schedule (applies to new quotes immediately, no deploy)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeSchedule"
      responses:
        "200":
          description: Updated fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"

  /admin/custom-jobs:
    get:
      operationId: getCustomJobs
      summary: List S-PAY's own injected job listings
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Custom listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomJobsResponse"
    post:
      operationId: createCustomJob
      summary: Inject an S-PAY job listing (pinned to the top of the feed)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomJobCreateRequest"
      responses:
        "200":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomJob"

  /admin/custom-jobs/{jobId}:
    delete:
      operationId: deleteCustomJob
      summary: Remove an injected listing
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/feature-flags:
    get:
      operationId: getFeatureFlags
      summary: Read runtime feature flags (card program switch, readiness, waitlist demand)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagsResponse"
    put:
      operationId: updateFeatureFlags
      summary: Toggle runtime feature flags (e.g. switch the card program on)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagsUpdateRequest"
      responses:
        "200":
          description: Updated flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagsResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phoneNumber:
          type: string
        country:
          type: string
          maxLength: 56
        accountType:
          type: string
          enum: [personal, business]
          default: personal
          description: "personal → Noah KYC · business → Noah KYB (business + representative verification)"
        businessName:
          type: string
          maxLength: 120
          description: Required when accountType is business — goes on the business virtual accounts
        signupSource:
          type: string
          maxLength: 64
          description: "Where the signup came from, e.g. jobs, jobs:<jobId>, landing, mobile"
      required:
        - email
        - password
        - fullName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    GoogleTokenRequest:
      type: object
      properties:
        idToken:
          type: string
          description: Google ID token obtained on-device (Android / iOS)
        signupSource:
          type: string
          maxLength: 64
      required:
        - idToken

    AppleTokenRequest:
      type: object
      properties:
        identityToken:
          type: string
          description: Apple identity token from Sign in with Apple
        fullName:
          type: string
          description: Provided by Apple only on first authorization
        signupSource:
          type: string
          maxLength: 64
      required:
        - identityToken

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        kycStatus:
          type: string
          enum: [pending, approved, rejected]
        isAdmin:
          type: boolean
        avatarUrl:
          type: string
        celoWalletAddress:
          type: string
          nullable: true
          description: "EVM wallet address on the Celo network, provisioned via Privy at signup"
        accountType:
          type: string
          enum: [personal, business]
        businessName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - kycStatus
        - isAdmin
        - createdAt

    DashboardSummary:
      type: object
      properties:
        walletBalance:
          type: number
        availableBalance:
          type: number
        currency:
          type: string
        totalIncoming:
          type: number
        totalOutgoing:
          type: number
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        quickStats:
          $ref: "#/components/schemas/QuickStats"
      required:
        - walletBalance
        - availableBalance
        - currency
        - totalIncoming
        - totalOutgoing
        - recentTransactions
        - quickStats

    QuickStats:
      type: object
      properties:
        transactionsThisMonth:
          type: integer
        totalSent:
          type: number
        totalReceived:
          type: number
      required:
        - transactionsThisMonth
        - totalSent
        - totalReceived

    WalletBalance:
      type: object
      properties:
        balance:
          type: number
        availableBalance:
          type: number
        currency:
          type: string
        celoAddress:
          type: string
        usdcBalance:
          type: number
        usdtBalance:
          type: number
      required:
        - balance
        - availableBalance
        - currency

    Transaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [send, receive, withdraw, recharge, payment]
        amount:
          type: number
        currency:
          type: string
        description:
          type: string
        counterparty:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - amount
        - currency
        - description
        - status
        - createdAt

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - transactions
        - total
        - limit
        - offset

    SendMoneyRequest:
      type: object
      properties:
        recipientPhone:
          type: string
        recipientAddress:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: USDC
        note:
          type: string
      required:
        - amount
        - currency

    AddFundsRequest:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
          default: USD
        method:
          type: string
          enum: [bank_transfer, card]
      required:
        - amount
        - currency
        - method

    AddFundsResponse:
      type: object
      properties:
        depositId:
          type: string
        instructions:
          type: string
        accountNumber:
          type: string
        routingNumber:
          type: string
        amount:
          type: number
        currency:
          type: string
      required:
        - depositId
        - instructions
        - amount
        - currency

    BankAccount:
      type: object
      properties:
        id:
          type: string
        currency:
          type: string
        accountType:
          type: string
          enum: [ach, sepa, pix]
        accountNumber:
          type: string
        routingNumber:
          type: string
        iban:
          type: string
        bankName:
          type: string
        availableBalance:
          type: number
        status:
          type: string
          enum: [active, pending, inactive]
      required:
        - id
        - currency
        - accountType
        - bankName
        - availableBalance
        - status

    BankingAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BankAccount"
        totalBalance:
          type: number
      required:
        - accounts
        - totalBalance

    IncomingPayment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        currency:
          type: string
        sender:
          type: string
        paymentType:
          type: string
          enum: [ach, wire, sepa, pix]
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - amount
        - currency
        - sender
        - paymentType
        - status
        - createdAt

    IncomingPaymentsResponse:
      type: object
      properties:
        payments:
          type: array
          items:
