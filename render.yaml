databases:
  # Managed PostgreSQL — provisioned automatically when this Blueprint is synced.
  # NOTE: the free plan expires after 30 days; upgrade to "basic-256mb" (paid)
  # in the Render dashboard for production durability.
  - name: spay-db
    plan: free
    region: oregon
    databaseName: spay
    user: spay

services:
  - type: web
    name: spay-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Wired automatically to the spay-db Postgres above (internal connection
      # string — same region, no egress cost). Schema migrations run on boot.
      - key: DATABASE_URL
        fromDatabase:
          name: spay-db
          property: connectionString
      # Set CORS_ORIGIN to your Vercel domain(s), comma-separated.
      # Example: https://spayewallet.com,https://spayewallet.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # Comma-separated emails that get access to /admin (register the account first!)
      - key: ADMIN_EMAILS
        sync: false
      # Optional: Noah API for virtual banking and FX payouts
      - key: NOAH_API_KEY
        sync: false
      - key: NOAH_WEBHOOK_SECRET
        sync: false
      # Optional: Google Sign-In (web flow + native Android/iOS token verification)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      # Optional: Sign in with Apple (defaults to com.zawaditechnologies.spay)
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      # Optional: Stripe for virtual card issuing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Wallet providers (WaaS) — configure at least ONE; the admin picks the
      # active one in /admin/settings. Setup walkthroughs: docs/WALLET-PROVIDERS.md
      # Privy (MAU-tier pricing)
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      # Coinbase CDP server wallets (per-operation pricing)
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: CDP_WALLET_SECRET
        sync: false
      # Turnkey (per-signature pricing)
      - key: TURNKEY_API_PUBLIC_KEY
        sync: false
      - key: TURNKEY_API_PRIVATE_KEY
        sync: false
      - key: TURNKEY_ORGANIZATION_ID
        sync: false
      # Openfort backend wallets (sk_ key + wallet secret from `openfort wallet-keys create`)
      - key: OPENFORT_API_KEY
        sync: false
      - key: OPENFORT_WALLET_SECRET
        sync: false
      # thirdweb server wallets (project secret key)
      - key: THIRDWEB_SECRET_KEY
        sync: false
      # Dynamic TSS-MPC server wallets (environment id + API token + a random
      # secret that derives per-wallet share-backup passwords — treat like a key)
      - key: DYNAMIC_ENVIRONMENT_ID
        sync: false
      - key: DYNAMIC_API_TOKEN
        sync: false
      - key: DYNAMIC_WALLET_PASSWORD_SECRET
        sync: false
      # Optional: Firebase push notifications
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Optional: Affiliate URLs for the jobs section
      - key: REMOTIVE_AFFILIATE_URL
        sync: false
      - key: REMOTE_COM_AFFILIATE_URL
        sync: false
